<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="ブラウザ完結型の高機能便利ツール集。画像変換・圧縮・切り抜き・リサイズ、動画変換、ネットワーク疎通確認。" />
		<title>Webツールボックス | ブラウザ完結の便利ツール集</title>
		<script>
			(function() {
				try {
					var storedTheme = localStorage.getItem('toolbox-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : (prefersDark ? 'dark' : 'light');
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
